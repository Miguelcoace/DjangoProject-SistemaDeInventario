{% extends "_general/_layout.html" %} 

{% block head_title %} Sistema de Inventario{% endblock %} 

{% block page_content %}

<div class="container">
    <h1>Movimientos de Inventario</h1>

    <section>
        <div class="row">
            {% for movement in all_movements %}
                <div class="col-12 col-sm-6 col-md-4">     
                    {% include '_includes/movement/_movement.html' %}
                </div>
            {% endfor %}
        </div>
        <a class="btn btn-primary btn-sm" role="button" href="{% url 'stock_create' %}">Añadir movimiento</a>
    </section>
</div>
{% endblock %}
